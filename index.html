<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move Lover - Pro Stream</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --tg-theme-bg: #0f0f0f; --tg-theme-text: #ffffff; --accent: #00acee; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--tg-theme-bg); color: var(--tg-theme-text); margin: 0; padding-bottom: 80px; }

        /* ১. লোডিং স্ক্রিন */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ২. হেডার ও টপ বার */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #1a1a1a; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 20px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; cursor: pointer; }

        /* ৩. মুভি কার্ড (Professional Style) */
        .movie-card { background: #000; margin-bottom: 20px; border-bottom: 1px solid #222; }
        .thumb-container { position: relative; width: 100%; height: 220px; }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; }
        .premium-badge { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); padding: 5px 12px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 5px; border: 1px solid #444; color: #fff; }
        .quality-tag { position: absolute; bottom: 10px; right: 10px; background: #000; font-size: 10px; padding: 2px 5px; border-radius: 3px; font-weight: bold; }

        .video-info { padding: 12px; display: flex; gap: 12px; }
        .user-avatar { width: 40px; height: 40px; background: #333; border-radius: 50%; flex-shrink: 0; overflow: hidden; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .meta-data { flex-grow: 1; }
        .v-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; line-height: 1.4; color: #eee; }
        .v-stats { font-size: 12px; color: #aaa; }

        /* ৪. ইন্টারেকশন বাটন (Like, Unlock, Share) */
        .interaction-bar { display: flex; gap: 10px; padding: 0 12px 12px; }
        .btn-action { background: #1a1a1a; color: white; border: none; padding: 8px 12px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .unlock-btn { background: #fff; color: #000; font-weight: bold; flex-grow: 1; justify-content: center; }

        /* ৫. কমেন্ট সেকশন */
        .comment-box { padding: 0 12px 15px; }
        .comment-input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; box-sizing: border-box; font-size: 13px; }
        
        /* অ্যাডমিন প্যানেল */
        #adminPanel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        .admin-btn { width: 100%; padding: 12px; background: var(--accent); border: none; color: white; font-weight: bold; border-radius: 8px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: #aaa; font-size: 14px;">Loading Move Lover...</p>
    </div>

    <div class="header">
        <div class="logo" onclick="tapAdmin()">
            <span style="color:var(--accent);">▶</span> Move Lover
        </div>
        <div class="user-avatar" id="topAvatar"></div>
    </div>

    <div id="movieFeed"></div>

    <div id="adminPanel">
        <h2 style="color:var(--accent); margin-top:0;">Admin Control</h2>
        <div style="background:#1a1a1a; padding:15px; border-radius:12px; border: 1px solid #333;">
            <p style="margin-top:0; font-size:14px; color:#aaa;">Upload New Content</p>
            <input type="text" id="mTitle" placeholder="Video Title" style="width:100%; padding:12px; margin-bottom:12px; background:#222; color:#fff; border:1px solid #444; border-radius:8px; box-sizing: border-box;">
            <input type="text" id="mThumb" placeholder="Thumbnail Image URL" style="width:100%; padding:12px; margin-bottom:12px; background:#222; color:#fff; border:1px solid #444; border-radius:8px; box-sizing: border-box;">
            <input type="text" id="mVideo" placeholder="Video Link" style="width:100%; padding:12px; margin-bottom:12px; background:#222; color:#fff; border:1px solid #444; border-radius:8px; box-sizing: border-box;">
            <button onclick="publishPost()" class="admin-btn">🚀 Publish Now</button>
            <button onclick="document.getElementById('adminPanel').style.display='none'" style="background:none; color:red; border:none; width:100%; margin-top:15px; cursor:pointer; font-weight:bold;">Exit Admin</button>
        </div>
        <div id="deleteList" style="margin-top:25px;"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // লোডার হ্যান্ডলার
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
            }, 1200);
        });

        let movies = JSON.parse(localStorage.getItem('myMovies')) || [];
        let globalAd = localStorage.getItem('globalAdLink') || "https://monetag.com";

        // ইউজারের তথ্য সেট করা
        const user = tg.initDataUnsafe?.user;
        if(user) {
            const avatarHtml = user.photo_url ? `<img src="${user.photo_url}">` : `<div style="padding:10px; font-weight:bold; color:white;">${user.first_name[0]}</div>`;
            document.getElementById('topAvatar').innerHTML = avatarHtml;
        }

        function renderAll() {
            const feed = document.getElementById('movieFeed');
            const delList = document.getElementById('deleteList');
            feed.innerHTML = '';
            delList.innerHTML = '';

            if(movies.length === 0) {
                feed.innerHTML = '<p style="text-align:center; color:#555; margin-top:50px;">No videos found.</p>';
            }

            movies.forEach((m, index) => {
                // র‌্যান্ডম ভিউ ও লাইক জেনারেটর (ইউজারের জন্য)
                const vCount = Math.floor(Math.random() * 5000) + 100;
                const lCount = Math.floor(Math.random() * 500) + 20;

                feed.innerHTML += `
                    <div class="movie-card">
                        <div class="thumb-container">
                            <img src="${m.thumb}" class="thumb-img">
                            <div class="premium-badge">🔒 PREMIUM</div>
                            <div class="quality-tag">HD</div>
                        </div>
                        <div class="video-info">
                            <div class="user-avatar">
                                <img src="${user?.photo_url || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}">
                            </div>
                            <div class="meta-data">
                                <div class="v-title">${m.title}</div>
                                <div class="v-stats">Move Lover • ${vCount} views • Recently</div>
                            </div>
                        </div>
                        <div class="interaction-bar">
                            <button class="btn-action" onclick="tg.showAlert('Liked!')">👍 ${lCount}</button>
                            <button class="btn-action unlock-btn" onclick="window.open('${globalAd}','_blank')">🔒 Unlock (0/3)</button>
                            <button class="btn-action">🔗 Share</button>
                        </div>
                        <div class="comment-box">
                            <input type="text" class="comment-input" placeholder="Add a public comment...">
                        </div>
                    </div>
                `;

                delList.innerHTML += `
                    <div style="background:#222; padding:10px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:12px;">${m.title}</span>
                        <button onclick="deleteMovie(${index})" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px; font-size:10px;">Delete</button>
                    </div>
                `;
            });
        }
        renderAll();

        function publishPost() {
            const t = document.getElementById('mTitle').value;
            const th = document.getElementById('mThumb').value;
            const v = document.getElementById('mVideo').value;
            if(t && th && v) {
                movies.unshift({title:t, thumb:th, video:v});
                localStorage.setItem('myMovies', JSON.stringify(movies));
                renderAll();
                document.getElementById('mTitle').value = '';
                document.getElementById('mThumb').value = '';
                document.getElementById('mVideo').value = '';
                tg.showAlert("✅ Post Published Successfully!");
            }
        }

        function deleteMovie(index) {
            if(confirm("Delete this video?")) {
                movies.splice(index, 1);
                localStorage.setItem('myMovies', JSON.stringify(movies));
                renderAll();
            }
        }

        // ৫ বার ট্যাপে অ্যাডমিন প্যানেল
        let taps = 0;
        function tapAdmin() {
            taps++;
            if(taps === 5) {
                let p = prompt("Admin Password:");
                if(p === "1234") {
                    document.getElementById('adminPanel').style.display = 'block';
                }
                taps = 0;
            }
        }
    </script>
</body>
</html>
